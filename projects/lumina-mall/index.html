<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="description" content="نموذج توضيحي من إيماك لصفحة مستثمرين تفاعلية: جولة ثلاثية الأبعاد داخل مول افتراضي، وحاسبة عائد، ووحدات متاحة، بالعربية والإنجليزية.">
<link rel="canonical" href="https://emacagency.github.io/projects/lumina-mall/">
<meta property="og:title" content="لومينا مول | عرض عقاري تفاعلي من إيماك">
<meta property="og:description" content="جولة ثلاثية الأبعاد وحاسبة عائد في صفحة مستثمرين واحدة. نموذج توضيحي بأرقام افتراضية.">
<meta property="og:image" content="https://emacagency.github.io/og-image.png">
<link rel="icon" href="../../favicon.svg" type="image/svg+xml">
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head>
<body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Sora:wght@500;600;700&display=swap">
<style>
/* Layout concept: dark atrium hero of nested glowing arches, then calm light/dark content bands for investors.
   Palette: night blue, lumen amber, teal. Type: Sora display, IBM Plex Sans Arabic body. */
:root{
  --bg:#F3F6F7; --surface:#FFFFFF; --ink:#0B1F2A; --muted:#475C69; --line:#D3DDE2;
  --accent:#9A5F00; --accent-ink:#FFFFFF; --teal:#0B7A70; --soft:#E8EEF1;
  --hero-bg:#071720; --hero-fg:#F1F5F7; --hero-muted:#A9BCC7; --lumen:#FFD479; --hero-teal:#3CC9B8;
  --ok:#0B7A70; --warn:#9A5F00;
  --display:'Sora','IBM Plex Sans Arabic',system-ui,sans-serif;
  --body:'IBM Plex Sans Arabic','IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#07151D; --surface:#0E2330; --ink:#EAF1F4; --muted:#9DB2BE; --line:#1E3846;
    --accent:#FFD479; --accent-ink:#1A1200; --teal:#3CC9B8; --soft:#0B1D28; --ok:#3CC9B8; --warn:#FFD479;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#07151D; --surface:#0E2330; --ink:#EAF1F4; --muted:#9DB2BE; --line:#1E3846;
  --accent:#FFD479; --accent-ink:#1A1200; --teal:#3CC9B8; --soft:#0B1D28; --ok:#3CC9B8; --warn:#FFD479;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.65}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--hero-bg)}
h1,h2,h3{font-family:var(--display);line-height:1.2;margin:0;text-wrap:balance}
html[lang="ar"] h1,html[lang="ar"] h2,html[lang="ar"] h3{font-family:var(--body);font-weight:600;line-height:1.35}
p{margin:0}
a{color:inherit}
.wrap{max-width:1160px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:4px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--hero-bg);color:var(--hero-fg);border-bottom:1px solid rgba(255,255,255,.08)}
.top .wrap{display:flex;align-items:center;gap:20px;min-height:62px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:700;letter-spacing:.18em;font-size:15px;text-decoration:none}
.brand svg{width:26px;height:26px}
.nav{display:flex;gap:22px;margin-inline-start:auto;font-size:14px}
.nav a{text-decoration:none;color:var(--hero-muted);padding:6px 0}
.nav a:hover{color:var(--hero-fg)}
.lang{font:inherit;font-size:13px;font-weight:600;color:var(--hero-fg);background:transparent;border:1px solid rgba(255,255,255,.28);border-radius:999px;padding:6px 14px;cursor:pointer}
.lang:hover{border-color:var(--lumen);color:var(--lumen)}
@media (max-width:760px){.nav{display:none}.lang{margin-inline-start:auto}}

/* hero */
.hero{background:var(--hero-bg);color:var(--hero-fg);overflow:hidden;position:relative}
.hero .wrap{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:32px;align-items:center;padding-block:56px 48px}
.badge{display:inline-block;border:1px solid var(--lumen);color:var(--lumen);border-radius:999px;font-size:12.5px;padding:4px 14px;margin-bottom:22px}
.hero h1{font-size:clamp(40px,7vw,76px);font-weight:700;letter-spacing:-.01em}
html[lang="ar"] .hero h1{letter-spacing:0;font-weight:600}
.hero .sub{color:var(--hero-muted);max-width:34em;margin-top:18px;font-size:18px}
.ctas{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}
.btn{display:inline-flex;align-items:center;justify-content:center;font:inherit;font-weight:600;font-size:15px;padding:12px 22px;border-radius:10px;border:1px solid transparent;cursor:pointer;text-decoration:none;transition:transform .15s}
.btn:hover{transform:translateY(-1px)}
.btn.primary{background:var(--lumen);color:#1A1200}
.btn.ghost{border-color:rgba(255,255,255,.3);color:var(--hero-fg);background:transparent}
.btn.solid{background:var(--accent);color:var(--accent-ink)}
.arch{width:100%;height:auto;display:block}
.arch .glow{animation:breathe 7s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.55}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){.arch .glow{animation:none}html{scroll-behavior:auto}.btn{transition:none}}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid rgba(255,255,255,.12);margin-top:8px}
.stat{padding:22px 0 26px;padding-inline-end:16px}
.stat b{display:block;font-family:var(--display);font-size:clamp(24px,3.4vw,36px);font-weight:600;color:var(--lumen);font-variant-numeric:tabular-nums}
.stat span{font-size:13.5px;color:var(--hero-muted)}
.hero .note{font-size:12.5px;color:var(--hero-muted);padding-bottom:20px}
@media (max-width:860px){.hero .wrap{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* sections */
section.band{padding-block:72px}
section.alt{background:var(--soft)}
.eyebrow{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);font-weight:600;margin-bottom:10px}
html[lang="ar"] .eyebrow{letter-spacing:0}
h2{font-size:clamp(26px,4vw,40px);max-width:20em}
.lead{color:var(--muted);max-width:40em;margin-top:14px;font-size:17px}
.sec-head{margin-bottom:36px}

/* location */
.loc{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,.8fr);gap:36px;align-items:center}
.mapbox{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px}
.mapbox svg{width:100%;height:auto;display:block}
.cap{font-size:12.5px;color:var(--muted);margin-top:8px}
.facts{display:grid;gap:0;margin:0;padding:0;list-style:none}
.facts li{display:flex;justify-content:space-between;gap:16px;padding:14px 0;border-bottom:1px solid var(--line)}
.facts li b{font-family:var(--display);font-weight:600;color:var(--accent);white-space:nowrap;font-variant-numeric:tabular-nums}
@media (max-width:860px){.loc{grid-template-columns:1fr}}
.m-land{fill:var(--soft)} .m-sea{fill:var(--line)} .m-road{stroke:var(--muted);stroke-width:3;fill:none;stroke-linecap:round}
.m-ring{fill:none;stroke:var(--accent);stroke-width:1.5;stroke-dasharray:5 6}
.m-t{fill:var(--muted);font-size:13px;font-family:var(--body)}
.m-pin{fill:var(--accent)} .m-pin-t{fill:var(--ink);font-weight:600;font-size:15px;font-family:var(--display)}
.m-dot{fill:var(--teal)}

/* hero photo drift */
.hero .wrap{position:relative;z-index:1}
.bgfx{position:absolute;inset:0;z-index:0;overflow:hidden}
.bgfx::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(7,23,32,.2),rgba(7,23,32,.62) 55%,rgba(7,23,32,.86))}
.hero h1,.hero .sub{text-shadow:0 2px 18px rgba(0,0,0,.55)}
.slide{position:absolute;inset:-8%;opacity:0;transition:opacity 1.8s ease;will-change:transform,opacity}
.slide.on{opacity:1}
.slide.vid{inset:0}
.slide video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.slide.live{animation:drift 16s ease-in-out forwards}
@keyframes drift{from{transform:translate3d(0,0,0) scale(1.02)}to{transform:translate3d(var(--dx,3%),var(--dy,2%),0) scale(var(--s,1.14))}}
.slide.ph{background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.05) 0 1px,transparent 1px 90px)}
.slot{position:absolute;top:18%;inset-inline-end:10%;font-size:13px;letter-spacing:.08em;color:rgba(255,255,255,.4);border:1px dashed rgba(255,255,255,.3);padding:6px 14px;border-radius:999px}
.photobar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding-bottom:22px}
.btn.small{padding:8px 16px;font-size:14px}
.sr{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}
.photobar:focus-within label{outline:3px solid var(--lumen);outline-offset:3px}
.phnote{font-size:12.5px;color:var(--hero-muted);flex:1 1 260px}
@media (prefers-reduced-motion:reduce){.slide{transition:none}.slide.live{animation:none}}

/* hologram (legacy rules) */
.stage{position:relative;height:clamp(440px,74vh,700px);border-radius:16px;overflow:hidden;background:radial-gradient(circle at 50% 30%,#06202c,#02080d 70%);border:1px solid rgba(82,229,255,.35);box-shadow:0 0 40px rgba(82,229,255,.12) inset;outline-offset:3px}
.stage::after{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(82,229,255,.045) 0 1px,transparent 1px 3px)}
.ovl{position:absolute;inset:0;z-index:5;display:grid;place-items:center;text-align:center;padding:24px;color:#E7F9FC;background:radial-gradient(circle at 50% 80%,rgba(82,229,255,.25),transparent 60%),rgba(2,8,13,.9)}
.ovl[hidden]{display:none}
.ovl h3{font-size:clamp(22px,3.4vw,32px);margin-bottom:10px;color:#52e5ff}
.ovl p{color:#9fc4cf;max-width:30em;margin:0 auto 20px}
.hud{position:absolute;top:12px;inset-inline-start:12px;z-index:3;pointer-events:none}
.zone{display:inline-block;background:rgba(2,12,18,.78);border:1px solid rgba(82,229,255,.45);color:#52e5ff;padding:7px 16px;border-radius:999px;font-size:14px;font-weight:500}
.holocard{position:absolute;z-index:6;left:12px;bottom:12px;width:min(390px,calc(100% - 24px));max-height:78%;overflow:auto;background:rgba(2,12,18,.9);border:1px solid rgba(82,229,255,.55);color:#E7F9FC;border-radius:12px;padding:16px 18px;font-size:14px;line-height:1.6;backdrop-filter:blur(6px)}
.holocard[hidden]{display:none}
.holocard h3{font-size:19px;color:#52e5ff;margin-bottom:2px;padding-inline-end:28px}
.holocard p{margin:8px 0 0}
.holocard .hc-meta{color:#9fc4cf;margin:0 0 8px}
.holocard .hc-row{display:flex;justify-content:space-between;gap:12px;border-top:1px solid rgba(82,229,255,.2);padding:5px 0}
.holocard .hc-row b{color:#FFD479;font-variant-numeric:tabular-nums}
.holocard .hc-t{color:#FFD479;font-weight:600;margin-top:12px}
.holocard ul{margin:6px 0 0;padding-inline-start:20px}
.holocard .hc-d{font-size:12px;color:#8fb0bb}
.holocard .hc-x{position:absolute;top:8px;inset-inline-end:10px;background:none;border:0;color:#E7F9FC;font-size:24px;line-height:1;cursor:pointer}
.holocard .hc-go{margin-top:12px;width:100%;font:inherit;font-weight:600;padding:9px;border-radius:8px;border:1px solid #52e5ff;background:rgba(82,229,255,.12);color:#52e5ff;cursor:pointer}
.joy{display:none;position:absolute;z-index:4;bottom:16px;left:16px;width:112px;height:112px;border-radius:50%;background:rgba(2,12,18,.55);border:1px solid rgba(82,229,255,.5);touch-action:none}
.joy i{position:absolute;width:44px;height:44px;border-radius:50%;background:#52e5ff;left:34px;top:34px;pointer-events:none}
.vbtns{display:none;position:absolute;z-index:4;bottom:16px;right:16px;gap:10px;flex-direction:column}
.vbtns button{width:48px;height:48px;border-radius:12px;border:1px solid rgba(82,229,255,.5);background:rgba(2,12,18,.6);color:#52e5ff;font-size:16px;touch-action:none}
@media (pointer:coarse){.joy{display:block}.vbtns{display:flex}}
.nogl{position:absolute;z-index:6;inset:auto 16px 16px 16px;margin:0;background:rgba(2,12,18,.92);color:#fff;padding:12px 16px;border-radius:10px}
.nogl[hidden]{display:none}
/* services */
.svc{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:0;border-top:1px solid var(--line);border-inline-start:1px solid var(--line)}
.svc article{padding:28px 26px;border-bottom:1px solid var(--line);border-inline-end:1px solid var(--line);background:var(--surface)}
.svc svg{width:34px;height:34px;stroke:var(--accent);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;margin-bottom:16px}
.svc h3{font-size:19px;margin-bottom:8px}
.svc p{color:var(--muted);font-size:15px}

/* properties */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:24px}
.chip{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:7px 16px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
.unit{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.unit .row1{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.unit h3{font-size:18px}
.tag{font-size:12px;font-weight:600;border-radius:999px;padding:3px 10px;white-space:nowrap}
.tag.av{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.tag.rs{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.unit .floor{font-size:13.5px;color:var(--muted)}
.unit dl{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px;margin:0}
.unit dt{font-size:12px;color:var(--muted)}
.unit dd{margin:0;font-family:var(--display);font-weight:600;font-size:17px;font-variant-numeric:tabular-nums}
.unit .btn{margin-top:auto;padding:9px 14px;font-size:14px;width:100%}
.unit .btn.line{border-color:var(--line);color:var(--ink);background:transparent}
.unit .btn.line:hover{border-color:var(--accent);color:var(--accent)}

/* returns */
.calc{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:28px;align-items:start}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:24px}
.fld{display:grid;gap:6px;margin-bottom:16px}
.fld label{font-size:14px;font-weight:500;display:flex;justify-content:space-between;gap:8px}
.fld label output{font-family:var(--display);color:var(--accent);font-weight:600;font-variant-numeric:tabular-nums}
.fld input[type=number]{font:inherit;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);width:100%;min-width:0}
.fld input[type=range]{width:100%;accent-color:var(--accent)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:22px}
.kpi{border:1px solid var(--line);border-radius:12px;padding:14px 16px;background:var(--bg)}
.kpi span{display:block;font-size:12.5px;color:var(--muted)}
.kpi b{font-family:var(--display);font-size:clamp(20px,2.6vw,26px);font-weight:600;font-variant-numeric:tabular-nums;display:block;margin-top:2px}
.kpi.main b{color:var(--accent)}
.chartbox{overflow-x:auto}
.chartbox svg{width:100%;min-width:420px;height:auto;display:block}
.c-bar{fill:var(--accent)} .c-grid{stroke:var(--line);stroke-width:1} .c-t{fill:var(--muted);font-size:11.5px;font-family:var(--body)}
.disc{font-size:13px;color:var(--muted);margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
@media (max-width:900px){.calc{grid-template-columns:1fr}}

/* timeline */
.tl{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:0;position:relative}
.tl article{padding:26px 22px 0 22px;border-top:2px solid var(--line);position:relative}
.tl article::before{content:"";position:absolute;top:-7px;inset-inline-start:22px;width:12px;height:12px;border-radius:50%;background:var(--accent)}
.tl h3{font-size:17px;margin-bottom:6px}
.tl p{color:var(--muted);font-size:14.5px}
.tl small{display:block;color:var(--accent);font-weight:600;margin-bottom:6px;font-size:13px}

/* contact */
.contact{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:36px;align-items:start}
form .fld input,form .fld select,form .fld textarea{font:inherit;padding:11px 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);width:100%;min-width:0}
form textarea{min-height:110px;resize:vertical}
.ok-msg{margin-top:14px;padding:12px 14px;border-radius:10px;background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--ink);border:1px solid var(--ok)}
@media (max-width:860px){.contact{grid-template-columns:1fr}}

footer{background:var(--hero-bg);color:var(--hero-muted);padding-block:34px;font-size:13.5px}
footer b{color:var(--lumen)}
/* realistic 3D */
.bgfx canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.bgfx.gl .slide.ph{display:none}
.hero .arch{visibility:hidden}
.stage{background:linear-gradient(180deg,#9cc3e2 0%,#dfe6e8 55%,#c4b48f 100%);border:1px solid var(--line);box-shadow:0 20px 50px rgba(7,23,32,.18)}
.stage::after{display:none}
.ovl{background:linear-gradient(180deg,rgba(7,23,32,.35),rgba(7,23,32,.7));backdrop-filter:blur(3px)}
.ovl h3{color:#fff}.ovl p{color:#e4eef3}
.zone{background:rgba(12,22,30,.78);border:1px solid rgba(255,255,255,.35);color:#fff}
.exitbtn{position:absolute;z-index:8;top:12px;inset-inline-end:12px;font:inherit;font-weight:600;font-size:14px;padding:9px 18px;border-radius:999px;border:1px solid rgba(255,255,255,.6);background:rgba(12,22,30,.82);color:#fff;cursor:pointer;backdrop-filter:blur(4px)}
.exitbtn:hover{background:#fff;color:#0c161e}
.exitbtn[hidden]{display:none}
.holocard{background:rgba(255,255,255,.96);color:#1a2630;border:1px solid rgba(0,0,0,.12);box-shadow:0 12px 30px rgba(0,0,0,.25)}
.holocard h3{color:#0b3d4f}.holocard .hc-meta,.holocard .hc-d{color:#5b6b75}
.holocard .hc-row{border-top-color:rgba(0,0,0,.1)}.holocard .hc-row b{color:#8a5a00}.holocard .hc-t{color:#8a5a00}
.holocard .hc-x{color:#1a2630}
.holocard .hc-go{border-color:#0b3d4f;background:#0b3d4f;color:#fff}
.joy{background:rgba(12,22,30,.5);border-color:rgba(255,255,255,.6)}.joy i{background:#fff}
.vbtns button{background:rgba(12,22,30,.6);color:#fff;border-color:rgba(255,255,255,.6)}
.chips.fs{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);z-index:7;margin:0!important;max-width:calc(100% - 24px);justify-content:center}
.chips.fs .chip{background:rgba(12,22,30,.8);color:#fff;border-color:rgba(255,255,255,.35)}
.chips.fs .chip[aria-pressed="true"]{background:#fff;color:#0c161e}

/* theme toggle + assistant */
.top #themeBtn{margin-inline-start:0;font-size:16px;line-height:1;padding:6px 12px}
.aiFab{position:fixed;z-index:40;bottom:max(16px,env(safe-area-inset-bottom,0px));inset-inline-end:max(16px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:10px;font:inherit;font-weight:600;font-size:15px;padding:13px 20px 13px 16px;border-radius:999px;border:0;cursor:pointer;background:var(--lumen);color:#1A1200;box-shadow:0 10px 28px rgba(0,0,0,.35),0 0 0 1px rgba(0,0,0,.08)}

function niceMax(v){
  const p=Math.pow(10,Math.floor(Math.log10(v||1)));const m=v/p;
  return (m<=1?1:m<=2?2:m<=5?5:10)*p;
}
function calc(){
  const A=+$("inArea").value,P=+$("inPrice").value,R=+$("inRent").value,O=+$("inOcc").value/100,E=+$("inEsc").value/100,C=+$("inCost").value/100;
  $("oArea").textContent=nf(A)+" m²";$("oPrice").textContent=nf(P);$("oRent").textContent=nf(R);
  $("oOcc").textContent=nf(O*100)+"%";$("oEsc").textContent=nf(E*100,1)+"%";$("oCost").textContent=nf(C*100)+"%";
  const price=A*P;
  const net=y=>A*R*O*Math.pow(1+E,y-1)*(1-C);
  let cum=0,pay=null,ten=0;const series=[];
  for(let y=1;y<=30;y++){
    const n=net(y),prev=cum;cum+=n;
    if(y<=10){ten+=n;series.push(n)}
    if(pay===null&&cum>=price)pay=(y-1)+(price-prev)/n;
  }
  $("kPrice").textContent=nf(price)+" "+t("aed");
  $("kYield").textContent=nf(net(1)/price*100,1)+"%";
  $("kPay").textContent=pay===null?t("over"):nf(pay,1)+" "+t("yrs");
  $("kTen").textContent=nf(ten)+" "+t("aed");
  drawChart(series);
}
function drawChart(s){
  const W=640,H=270,L=58,B=30,T=14,Rm=10;
  const max=niceMax(Math.max(...s));const iw=W-L-Rm,ih=H-T-B;
  let g="";
  for(let i=0;i<=4;i++){
    const v=max*i/4,y=T+ih-(v/max)*ih;
    g+=`<line class="c-grid" x1="${L}" x2="${W-Rm}" y1="${y}" y2="${y}"/><text class="c-t" x="${L-8}" y="${y+4}" text-anchor="end">${cf(v)}</text>`;
  }
  const bw=iw/s.length*.62;
  s.forEach((v,i)=>{
    const x=L+iw/s.length*i+(iw/s.length-bw)/2,h=(v/max)*ih;
    g+=`<rect class="c-bar" x="${x}" y="${T+ih-h}" width="${bw}" height="${h}" rx="3"/><text class="c-t" x="${x+bw/2}" y="${H-10}" text-anchor="middle">${i+1}</text>`;
  });
  g+=`<text class="c-t" x="${W-Rm}" y="${H-0}" text-anchor="end"></text>`;
  $("chart").innerHTML=g;
  $("chart").setAttribute("aria-label",t("yLabel"));
}

const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;

<script>
(function(){
const box=document.getElementById("bgfx"),inp=document.getElementById("photoIn"),clr=document.getElementById("phClear");
if(!box||!inp)return;
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
const DEF=[{v:"media/v1.mp4"},{v:"media/v2.mp4"},{v:"media/v3.mp4"},{v:"media/v5.mp4"}];
let slides=[],cur=-1,timer=null,urls=[],gen=0;
function mk(it){
 const d=document.createElement("div");d.className="slide";
 if(it.v){
  d.classList.add("vid");const v=document.createElement("video");v.muted=true;v.defaultMuted=true;v.playsInline=true;v.setAttribute("playsinline","");v.setAttribute("webkit-playsinline","");v.disablePictureInPicture=true;v.preload=slides.length===0?"auto":"none";v.src=it.v;
  v.addEventListener("error",()=>{d.dataset.bad="1";if(slides[cur]===d)next()});d.appendChild(v);d.v=v;
 }else{d.style.background='center / cover no-repeat url("'+it.i+'")'}
 box.appendChild(d);return d;
}
function next(){if(slides.length<2&&!slides[0].v)return;let n=cur,k=0;do{n=(n+1)%slides.length;k++}while(slides[n].dataset.bad&&k<=slides.length);show(n)}
function show(i){
 const s=slides[i],prev=slides[cur],my=++gen;clearTimeout(timer);
 if(!s.v){s.style.setProperty("--dx",(Math.random()*8-4).toFixed(1)+"%");s.style.setProperty("--dy",(Math.random()*6-3).toFixed(1)+"%");s.style.setProperty("--s",(1.12+Math.random()*.06).toFixed(2));s.classList.remove("live");void s.offsetWidth;if(!reduce)s.classList.add("live")}
 s.classList.add("on");
 if(s.v){
  s.v.currentTime=0;const p=s.v.play();if(p&&p.catch)p.catch(()=>{});
  s.v.onended=()=>{if(my===gen)next()};
  timer=setTimeout(()=>{if(my===gen)next()},13000);
  const nx=slides[(i+1)%slides.length];if(nx&&nx.v&&nx.v.preload==="none"){nx.v.preload="auto";nx.v.load()}
 }else if(slides.length>1){timer=setTimeout(()=>{if(my===gen)next()},7000)}
 if(prev&&prev!==s){prev.classList.remove("on");setTimeout(()=>{if(!prev.classList.contains("on")){prev.classList.remove("live");if(prev.v)prev.v.pause()}},2200)}
 cur=i;
}
function clear(){gen++;clearTimeout(timer);box.querySelectorAll(".slide").forEach(e=>{if(e.v)e.v.pause();e.remove()});urls.forEach(u=>URL.revokeObjectURL(u));urls=[];slides=[];cur=-1}
function defaults(){clear();DEF.forEach(it=>slides.push(mk(it)));clr.hidden=true;if(reduce){slides[0].classList.add("on");slides[0].v.preload="auto";cur=0}else show(0)}
inp.addEventListener("change",()=>{
 const files=Array.from(inp.files||[]).filter(f=>/^image\//.test(f.type)).slice(0,12);
 if(!files.length)return;
 clear();
 files.forEach(f=>{const u=URL.createObjectURL(f);urls.push(u);slides.push(mk({i:u}))});
 clr.hidden=false;show(0);inp.value="";
});
clr.addEventListener("click",defaults);
document.addEventListener("visibilitychange",()=>{const s=slides[cur];if(s&&s.v){document.hidden?s.v.pause():s.v.play().catch(()=>{})}});
defaults();
})();

</script>
