name: Narrate articles

on:
  push:
    branches: [main]
    paths: ["research/narration/**"]
  workflow_dispatch:
    inputs:
      force:
        description: "Re-voice every article"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  narrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install edge-tts==7.2.0
      - name: Voice changed narration files
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ vars.ELEVENLABS_VOICE_ID }}
          EDGE_VOICE: ${{ vars.EDGE_VOICE }}
          FORCE: ${{ inputs.force }}
        run: python tools/narrate.py
      - name: Commit audio
        run: |
          git config user.name "emac-narrator"
          git config user.email "actions@users.noreply.github.com"
          git add research/audio
          git diff --cached --quiet || (git commit -m "Update article narration" && git push)
