name: Publish Instagram reels

on:
  push:
    paths: ["research/ig-queue/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Publish queued reels
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: python tools/ig_publish.py
      - name: Record published links
        if: always()
        run: |
          git config user.name "emac-publisher"
          git config user.email "actions@users.noreply.github.com"
          git add research/ig-queue
          git diff --cached --quiet || (git commit -m "Record published Instagram reels" && git push)
