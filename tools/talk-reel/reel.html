<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Plex;font-weight:400;src:url(fonts/fontsource-ibm-plex-sans-arabic-5.3.0/files/ibm-plex-sans-arabic-arabic-400-normal.woff2)}
@font-face{font-family:Plex;font-weight:700;src:url(fonts/fontsource-ibm-plex-sans-arabic-5.3.0/files/ibm-plex-sans-arabic-arabic-700-normal.woff2)}
@font-face{font-family:PlexL;font-weight:400;src:url(fonts/fontsource-ibm-plex-sans-arabic-5.3.0/files/ibm-plex-sans-arabic-latin-400-normal.woff2)}
@font-face{font-family:Bebas;src:url(fonts/fontsource-bebas-neue-5.3.0/files/bebas-neue-latin-400-normal.woff2)}
html,body{margin:0;background:#000}
canvas{display:block}
</style></head><body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
const W=1080,H=1920,c=document.getElementById('c'),x=c.getContext('2d');
let T=null; // {words, lines}
const AMBER='#E8B04B', WHITE='#F2F2F2', RED='#E5484D', MUTED='rgba(242,242,242,.55)';
const cl=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,k)=>a+(b-a)*k;
const eo=k=>1-Math.pow(1-cl(k),3);            // ease out
const eio=k=>{k=cl(k);return k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2};
const back=k=>{k=cl(k);const s=1.7;return 1+(s+1)*Math.pow(k-1,3)+s*Math.pow(k-1,2)};
const wt=i=>T.words[i].t;                        // word start
const ramp=(t,t0,d=.4)=>cl((t-t0)/d);

// ---------- film grain ----------
const grains=[];
for(let g=0;g<6;g++){const gc=document.createElement('canvas');gc.width=540;gc.height=960;const gx=gc.getContext('2d');
 const id=gx.createImageData(540,960);for(let i=0;i<id.data.length;i+=4){const v=Math.random()*255;id.data[i]=id.data[i+1]=id.data[i+2]=v;id.data[i+3]=14}
 gx.putImageData(id,0,0);grains.push(gc)}
// dust
const dust=[...Array(70)].map((_,i)=>({x:Math.random()*W,y:Math.random()*H,r:.6+Math.random()*2.2,s:.15+Math.random()*.5,p:Math.random()*6.28}));

function font(sz,w=700,fam='Plex'){x.font=`${w} ${sz}px ${fam}`}
function txt(s,X,Y,sz,col,{w=700,a=1,fam='Plex',align='center',blur=0,glow=0,ls=0}={}){
  x.save();x.globalAlpha*=a;font(sz,w,fam);x.textAlign=align;x.textBaseline='middle';
  x.direction=/[؀-ۿ]/.test(s)?'rtl':'ltr';
  if(ls)x.letterSpacing=ls+'px';
  if(blur)x.filter=`blur(${blur}px)`;
  if(glow){x.shadowColor=col;x.shadowBlur=glow}
  x.fillStyle=col;x.fillText(s,X,Y);x.restore();
}
function tw(s,sz,w=700,fam='Plex'){font(sz,w,fam);x.direction=/[؀-ۿ]/.test(s)?'rtl':'ltr';return x.measureText(s).width}

// ---------- background ----------
function background(t,warm,dark){
  const g=x.createLinearGradient(0,0,0,H);
  const top=`rgb(${lerp(10,26,warm)|0},${lerp(14,17,warm)|0},${lerp(24,16,warm)|0})`;
  g.addColorStop(0,top);g.addColorStop(1,'#05070b');x.fillStyle=g;x.fillRect(0,0,W,H);
  // spotlight
  const r=x.createRadialGradient(W/2,820,40,W/2,820,900);
  const sc=warm>.5?`rgba(232,176,75,${.10*warm})`:`rgba(90,130,200,${.13*(1-dark)})`;
  r.addColorStop(0,sc);r.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=r;x.fillRect(0,0,W,H);
  // dust
  for(const d of dust){const y=(d.y-t*d.s*30+H*10)%H, xx=d.x+Math.sin(t*.4+d.p)*12;
    x.fillStyle=warm>.5?`rgba(255,220,160,${.12+.1*Math.sin(t+d.p)})`:`rgba(180,205,255,${.10+.08*Math.sin(t+d.p)})`;
    x.beginPath();x.arc(xx,y,d.r,0,6.28);x.fill()}
}
function post(t,vig){
  const v=x.createRadialGradient(W/2,H/2,H*.28,W/2,H/2,H*.75);
  v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,`rgba(0,0,0,${vig})`);x.fillStyle=v;x.fillRect(0,0,W,H);
  x.globalCompositeOperation='overlay';x.drawImage(grains[(t*30|0)%6],0,0,W,H);x.globalCompositeOperation='source-over';
}

// ---------- captions (word by word, follows the voice) ----------
function chunks(a,b){const out=[];let cur=[];for(let i=a;i<=b;i++){cur.push(i);
  const w=T.words[i].w;const endP=i===b||(T.words[i+1]&&T.words[i+1].t-(T.words[i].t+T.words[i].d)>.28);
  if(cur.length>=3||endP){out.push(cur);cur=[]}}if(cur.length)out.push(cur);return out}
let CH=null;
function caption(t,Y=1600,sz=60,big=false){
  if(!CH)CH=T.lines.map(l=>chunks(l.a,l.b));
  let li=T.lines.findIndex((l,i)=>t>=l.s-.05&&t<(T.lines[i+1]?T.lines[i+1].s-.05:l.e+.6));
  if(li<0)return; const ln=T.lines[li];
  if(t>ln.e+.5)return;
  let ch=CH[li].find(c=>t<T.words[c[c.length-1]].t+T.words[c[c.length-1]].d+.12)||CH[li][CH[li].length-1];
  if(big)ch=[...Array(ln.b-ln.a+1)].map((_,k)=>ln.a+k);
  const ws=ch.map(i=>T.words[i].w), sp=sz*.32;
  const widths=ws.map(w=>tw(w,sz));const total=widths.reduce((a,b)=>a+b,0)+sp*(ws.length-1);
  // background pill
  if(!big){x.save();x.fillStyle='rgba(0,0,0,.35)';const pw=total+70,ph=sz*1.6;
   x.beginPath();x.roundRect(W/2-pw/2,Y-ph/2,pw,ph,ph/2);x.fill();x.restore()}
  let X=W/2+total/2;
  ch.forEach((i,k)=>{const w=T.words[i];const on=t>=w.t-.03;const cur=on&&t<w.t+w.d+.08;
    const a=on?1:big?.22:.45; const pop=cur?1+.06*eo((t-w.t)/.12):1;
    x.save();x.translate(X-widths[k]/2,Y);x.scale(pop,pop);
    txt(w.w,0,0,sz,cur?AMBER:WHITE,{a,glow:cur?18:0});x.restore();X-=widths[k]+sp});
}

// ---------- scene pieces ----------
function chartFrame(a){ // axes for the line chart
  x.save();x.globalAlpha=a;x.strokeStyle='rgba(242,242,242,.18)';x.lineWidth=2;
  for(let i=0;i<5;i++){x.beginPath();x.moveTo(140,820+i*120);x.lineTo(940,820+i*120);x.stroke()}
  x.restore();
}
// S0+S1 path: points in chart space
const P=[[0,.55],[.12,.5],[.24,.6],[.36,.52],[.48,.86],[.6,.7],[.72,.42],[.86,.18],[1,.05]];
function pathPt(k){const n=P.length-1,f=k*n,i=Math.min(n-1,f|0),r=f-i;return[lerp(P[i][0],P[i+1][0],r),lerp(P[i][1],P[i+1][1],r)]}
function toXY(p){return[140+p[0]*800,820+p[1]*480]}
function lineChart(t){
  const L0=T.lines[0],L1=T.lines[1];
  // reveal: up to dip by "يفشل", then rise to the peak by "ينجح"
  let k=0;
  if(t<wt(7))k=lerp(0,.45,eo((t-L0.s)/(wt(7)-L0.s)));
  else if(t<wt(9))k=lerp(.45,.52,eo((t-wt(7))/.5));
  else k=lerp(.52,1,eo((t-wt(9))/.9));
  const a=ramp(t,L0.s-.2,.5)*(1-ramp(t,L1.e+.1,.35));
  if(a<=0)return;
  chartFrame(a);
  x.save();x.globalAlpha=a;x.lineJoin='round';x.lineCap='round';
  const steps=120;let pts=[];for(let i=0;i<=steps*k;i++)pts.push(toXY(pathPt(i/steps)));
  // area
  if(pts.length>1){const ag=x.createLinearGradient(0,820,0,1300);const rising=t>wt(9);
    ag.addColorStop(0,rising?'rgba(232,176,75,.30)':'rgba(229,72,77,.22)');ag.addColorStop(1,'rgba(0,0,0,0)');
    x.fillStyle=ag;x.beginPath();x.moveTo(pts[0][0],1300);pts.forEach(p=>x.lineTo(p[0],p[1]));x.lineTo(pts[pts.length-1][0],1300);x.fill();
    // line, colored by slope
    x.lineWidth=9;
    for(let i=1;i<pts.length;i++){const down=pts[i][1]>pts[i-1][1];x.strokeStyle=down?RED:(t>wt(9)?AMBER:WHITE);
      x.shadowColor=x.strokeStyle;x.shadowBlur=14;x.beginPath();x.moveTo(...pts[i-1]);x.lineTo(...pts[i]);x.stroke()}
    const hd=pts[pts.length-1];x.shadowBlur=30;x.fillStyle=WHITE;x.beginPath();x.arc(hd[0],hd[1],13,0,6.28);x.fill();
  }
  x.restore();
  // labels
  const dip=toXY(P[4]);
  txt('فشل',dip[0],dip[1]+80,52,RED,{a:a*ramp(t,wt(7),.3)*(1-ramp(t,wt(9),.4))});
  if(t>wt(9)){const pk=toXY(P[8]);const b=ramp(t,wt(9)+.7,.35);
    // burst at the peak
    x.save();x.globalAlpha=a*b*(1-ramp(t,wt(9)+1.6,.6));x.strokeStyle=AMBER;x.lineWidth=4;
    for(let i=0;i<12;i++){const an=i/12*6.28,r1=34+50*eo((t-wt(9)-.7)/.6),r2=r1+28;
      x.beginPath();x.moveTo(pk[0]+Math.cos(an)*r1,pk[1]+Math.sin(an)*r1);x.lineTo(pk[0]+Math.cos(an)*r2,pk[1]+Math.sin(an)*r2);x.stroke()}
    x.restore();
    txt('نجاح',pk[0]-60,pk[1]+90,52,AMBER,{a:a*b*(1-ramp(t,wt(15),.3))});
  }
  // the die lands on the peak at "مجرّد حظّ"
  if(t>wt(15)-.2){const pk=toXY(P[8]);const d=eo((t-wt(15)+.2)/.55);const y=lerp(pk[1]-520,pk[1]-70,d)+Math.sin(d*Math.PI)*-40;
    dieAt(pk[0]-90,y,(1-d)*4+.15*Math.sin(t*2),a*ramp(t,wt(15)-.2,.2));
    txt('«يمكن كنت محظوظ»',W/2,1420,60,MUTED,{w:400,a:a*ramp(t,wt(16),.35),blur:lerp(6,0,ramp(t,wt(16),.4))});
  }
}
function dieAt(X,Y,rot,a){x.save();x.globalAlpha=a;x.translate(X,Y);x.rotate(rot);const s=110;
  x.shadowColor='rgba(232,176,75,.6)';x.shadowBlur=30;x.fillStyle='#f4efe6';x.beginPath();x.roundRect(-s/2,-s/2,s,s,20);x.fill();x.shadowBlur=0;
  x.fillStyle='#14181f';[[-1,-1],[1,1],[0,0],[1,-1],[-1,1]].forEach(([i,j])=>{x.beginPath();x.arc(i*28,j*28,10,0,6.28);x.fill()});x.restore()}

function mask(X,Y,s,a,split=0){ // half-face theatre mask outline
  x.save();x.globalAlpha=a;x.translate(X,Y);x.scale(s,s);x.lineWidth=5/s*1.0;x.lineJoin='round';
  const face=()=>{x.beginPath();x.moveTo(0,-170);x.bezierCurveTo(120,-170,150,-60,140,20);x.bezierCurveTo(130,120,70,190,0,200);
    x.bezierCurveTo(-70,190,-130,120,-140,20);x.bezierCurveTo(-150,-60,-120,-170,0,-170);x.closePath()};
  // right half (real) and left half (mask), split apart
  for(const side of[1,-1]){x.save();x.translate(side*split*60,0);x.beginPath();x.rect(side>0?0:-200,-260,200,520);x.clip();
    face();const g=x.createLinearGradient(-150,0,150,0);
    if(side>0){g.addColorStop(0,'rgba(120,150,210,.10)');g.addColorStop(1,'rgba(120,150,210,.30)');x.fillStyle=g;x.fill();x.strokeStyle='rgba(242,242,242,.75)'}
    else{x.fillStyle='rgba(232,176,75,.22)';x.fill();x.strokeStyle=AMBER}
    x.lineWidth=5;x.stroke();
    // eye
    x.beginPath();x.ellipse(side*58,-30,30,14,side*.15,0,6.28);x.fillStyle='#07090d';x.fill();x.strokeStyle=side>0?'rgba(242,242,242,.75)':AMBER;x.lineWidth=4;x.stroke();
    // mouth
    x.beginPath();if(side>0){x.moveTo(0,110);x.quadraticCurveTo(40,104,62,96)}else{x.moveTo(0,110);x.quadraticCurveTo(-40,126,-62,104)}x.lineWidth=5;x.stroke();
    x.restore()}
  // split line
  x.strokeStyle=`rgba(242,242,242,${.4*(1-split)})`;x.setLineDash([10,12]);x.lineWidth=3;x.beginPath();x.moveTo(0,-200);x.lineTo(0,230);x.stroke();
  x.restore()}

function titleCard(t,t0,Y=620,showMask=true){
  const k=ramp(t,t0,.7);const ls=lerp(46,10,eo(k));
  txt('IMPOSTER',W/2,Y,210,WHITE,{fam:'Bebas',w:400,a:eo(k),ls,glow:20});
  txt('SYNDROME',W/2,Y+190,210,AMBER,{fam:'Bebas',w:400,a:eo(ramp(t,t0+.25,.7)),ls:lerp(46,10,eo(ramp(t,t0+.25,.7))),glow:24});
  txt('متلازمة المحتال',W/2,Y+360,84,WHITE,{a:eo(ramp(t,t0+.5,.5))});
}

function bars(t){
  const L=T.lines[3];const a=ramp(t,L.s-.1,.3)*(1-ramp(t,L.e+.15,.3));if(a<=0)return;
  txt('والغريب؟',W/2,560,118,WHITE,{a:a*eo(ramp(t,wt(25),.35)),glow:10});
  txt('مين بتصيب؟',W/2,700,58,MUTED,{w:400,a:a*ramp(t,wt(26),.4)});
  const base=1330;x.save();x.globalAlpha=a;x.strokeStyle='rgba(242,242,242,.25)';x.lineWidth=3;x.beginPath();x.moveTo(170,base);x.lineTo(910,base);x.stroke();x.restore();
  // right bar: الكسلان (short, grey)
  const h1=lerp(0,120,back(ramp(t,wt(30),.5)));
  x.save();x.globalAlpha=a;x.fillStyle='rgba(242,242,242,.28)';x.beginPath();x.roundRect(640,base-h1,190,h1,[16,16,0,0]);x.fill();x.restore();
  txt('الكسلان',735,base+60,50,MUTED,{a:a*ramp(t,wt(30),.3)});
  // cross over the lazy bar
  if(t>wt(31)){x.save();x.globalAlpha=a*ramp(t,wt(31),.3);x.strokeStyle=RED;x.lineWidth=8;x.lineCap='round';const k=eo(ramp(t,wt(31),.3));
    x.beginPath();x.moveTo(660,base-140);x.lineTo(lerp(660,810,k),lerp(base-140,base+10,k));x.stroke();x.restore()}
  // left bar: الطموحين (tall, amber)
  const h2=lerp(0,470,back(ramp(t,wt(33),.8)));
  x.save();x.globalAlpha=a;const g=x.createLinearGradient(0,base-470,0,base);g.addColorStop(0,AMBER);g.addColorStop(1,'rgba(232,176,75,.35)');
  x.fillStyle=g;x.shadowColor=AMBER;x.shadowBlur=30;x.beginPath();x.roundRect(250,base-h2,190,h2,[16,16,0,0]);x.fill();x.restore();
  txt('الطموحين',345,base+60,50,AMBER,{a:a*ramp(t,wt(33),.3)});
  txt('والمجتهدين',345,base+122,50,AMBER,{a:a*ramp(t,wt(34),.3)});
}

function gapChart(t){
  const L=T.lines[4];const a=ramp(t,L.s-.1,.3)*(1-ramp(t,T.lines[5].s+1.6,.5));if(a<=0)return;
  const ox=150,oy=1320,w=780,h=620;
  x.save();x.globalAlpha=a;x.strokeStyle='rgba(242,242,242,.3)';x.lineWidth=3;x.beginPath();x.moveTo(ox,oy-h-20);x.lineTo(ox,oy);x.lineTo(ox+w+10,oy);x.stroke();x.restore();
  txt('الوقت والخبرة',ox+w-90,oy+50,40,MUTED,{w:400,a});
  const k1=eo(ramp(t,wt(38),2.6)), k2=eo(ramp(t,wt(42),1.6));
  const f1=u=>oy-h*.42*Math.pow(u,1.1), f2=u=>oy-h*Math.pow(u,1.5)*.98;
  const draw=(f,k,col,dash)=>{x.save();x.globalAlpha=a;x.strokeStyle=col;x.lineWidth=8;x.lineCap='round';if(dash)x.setLineDash([22,16]);
    x.shadowColor=col;x.shadowBlur=14;x.beginPath();for(let i=0;i<=100*k;i++){const u=i/100;const X=ox+u*w,Y=f(u);i?x.lineTo(X,Y):x.moveTo(X,Y)}x.stroke();x.restore()};
  // gap area
  const ga=ramp(t,wt(46),.6);
  if(ga>0){x.save();x.globalAlpha=a*ga*.9;const g=x.createLinearGradient(0,oy-h,0,oy);g.addColorStop(0,'rgba(229,72,77,.38)');g.addColorStop(1,'rgba(229,72,77,.05)');
    x.fillStyle=g;x.beginPath();for(let i=0;i<=100;i++){const u=i/100;x.lineTo(ox+u*w,f2(u))}for(let i=100;i>=0;i--){const u=i/100;x.lineTo(ox+u*w,f1(u))}x.fill();x.restore()}
  draw(f1,k1,WHITE,false);draw(f2,k2,AMBER,true);
  txt('اللي تعلّمته',ox+w*.3,f1(.3)+70,44,WHITE,{a:a*ramp(t,wt(39),.4)});
  txt('اللي صرت تشوفه قدّامك',ox+w-260,f2(1)-10,44,AMBER,{a:a*ramp(t,wt(44),.4)});
  // gap bracket + label
  if(ga>0){const X=ox+w*.7;x.save();x.globalAlpha=a*ga;x.strokeStyle=RED;x.lineWidth=4;x.beginPath();x.moveTo(X,f2(.7)+8);x.lineTo(X,f1(.7)-8);x.stroke();
    [f2(.7)+8,f1(.7)-8].forEach(Y=>{x.beginPath();x.moveTo(X-16,Y);x.lineTo(X+16,Y);x.stroke()});x.restore();
    const gl=ramp(t,wt(52),.4);
    txt('الفجوة',ox+w*.89,(f1(.9)+f2(.9))/2+20,54,RED,{a:a*Math.max(ga*.6,gl),glow:gl*20});}
  // "you are here" dot riding the learning curve
  const u=k1;txt('أنت هنا',ox+u*w,f1(u)-56,36,MUTED,{w:400,a:a*ramp(t,wt(38),.4)*(1-ramp(t,wt(46),.3))});
  x.save();x.globalAlpha=a;x.fillStyle=WHITE;x.shadowColor=WHITE;x.shadowBlur=20;x.beginPath();x.arc(ox+u*w,f1(u),12,0,6.28);x.fill();x.restore();
}

const whispers=['أنا مو جاهز','يمكن كنت محظوظ','ما بستحق','رح يكتشفوا','مو قدّها'];
function innerVoice(t){
  const L=T.lines[5];const a=ramp(t,wt(54),.4)*(1-ramp(t,T.lines[6].s-.15,.3));if(a<=0)return;
  // drifting faint whispers in the back
  whispers.forEach((s,i)=>{const yy=420+i*250+Math.sin(t*.7+i)*18, xx=W/2+Math.sin(t*.35+i*1.7)*230;
    txt(s,xx,yy,44+i%2*10,'rgba(242,242,242,.10)',{w:400,a,blur:3})});
  const k1=ramp(t,wt(55),.5);const off1=1-ramp(t,wt(58)+.1,.35);
  txt('«أنا مو جاهز»',W/2,860,110,WHITE,{a:a*k1*off1,blur:lerp(14,0,eo(k1)),glow:12});
  const k2=ramp(t,wt(59),.5);
  txt('يمكن ما بستحق',W/2,820,92,WHITE,{a:a*k2,blur:lerp(14,0,eo(k2))});
  txt('اللي وصلتلُه',W/2,950,92,WHITE,{a:a*ramp(t,wt(62),.5),blur:lerp(14,0,eo(ramp(t,wt(62),.5)))});
}

function doubtCard(t){
  const L=T.lines[6];const a=ramp(t,L.s,.3)*(1-ramp(t,L.e+.05,.25));if(a<=0)return;
  const Y=640;
  txt('الشك',W/2+280,Y,130,WHITE,{a:a*eo(ramp(t,wt(65),.35)),glow:10});
  txt('الفشل',W/2-280,Y,130,WHITE,{a:a*eo(ramp(t,wt(68),.35)),glow:10});
  // ≠ drawn as strokes
  const k=eo(ramp(t,wt(69),.45));
  x.save();x.globalAlpha=a;x.strokeStyle=AMBER;x.lineWidth=14;x.lineCap='round';x.shadowColor=AMBER;x.shadowBlur=26;
  [[-25],[25]].forEach(([dy])=>{x.beginPath();x.moveTo(W/2-60,Y+dy);x.lineTo(W/2-60+120*k,Y+dy);x.stroke()});
  const k2=eo(ramp(t,wt(69)+.25,.35));x.beginPath();x.moveTo(W/2+40,Y-75);x.lineTo(W/2+40-80*k2,Y-75+150*k2);x.stroke();x.restore();
  // growing beyond a boundary
  const C=[W/2,1130];const R=200;const gk=eo(ramp(t,wt(73),1.6));const br=ramp(t,wt(77),.6);
  x.save();x.globalAlpha=a*ramp(t,wt(70),.4);
  if(br<=0){x.setLineDash([14,14]);x.strokeStyle='rgba(242,242,242,.55)';x.lineWidth=5;x.beginPath();x.arc(...C,R,0,6.28);x.stroke();x.setLineDash([])}
  else{ // the ring breaks into arcs that fly out
    for(let i=0;i<10;i++){const a0=i/10*6.28,d=R+eo(br)*170;x.strokeStyle=`rgba(242,242,242,${.55*(1-br)})`;x.lineWidth=5;
      x.beginPath();x.arc(C[0]+Math.cos(a0+.31)*(d-R),C[1]+Math.sin(a0+.31)*(d-R),R,a0+.06,a0+.56);x.stroke()}}
  const rr=lerp(60,R*1.15,gk)+(br>0?eo(br)*40:0);
  const g=x.createRadialGradient(...C,0,...C,rr);g.addColorStop(0,'rgba(255,214,140,.95)');g.addColorStop(.6,'rgba(232,176,75,.55)');g.addColorStop(1,'rgba(232,176,75,0)');
  x.fillStyle=g;x.beginPath();x.arc(...C,rr,0,6.28);x.fill();x.restore();
  txt('تتجاوز حدودك',W/2,1430,62,AMBER,{a:a*ramp(t,wt(76),.4)});
}

function cta(t){
  const L=T.lines[8];const a=ramp(t,L.s-.1,.3)*(1-ramp(t,L.e+.6,.4));if(a<=0)return;
  // comment bubble with typing dots
  const bx=W/2,by=640,k=back(ramp(t,L.s,.5));
  x.save();x.globalAlpha=a;x.translate(bx,by);x.scale(k,k);x.fillStyle='rgba(242,242,242,.95)';x.beginPath();x.roundRect(-210,-110,420,200,60);x.fill();
  x.beginPath();x.moveTo(110,80);x.lineTo(170,150);x.lineTo(40,88);x.fill();
  for(let i=0;i<3;i++){x.fillStyle='#0b0f17';x.globalAlpha=a*(.35+.65*Math.max(0,Math.sin(t*7-i*.9)));x.beginPath();x.arc(-80+i*80,-10,22,0,6.28);x.fill()}
  x.restore();
  txt('اكتبها بالتعليقات',W/2,900,82,WHITE,{a:a*ramp(t,wt(88),.35)});
  // bouncing arrow
  const ay=1010+Math.abs(Math.sin(t*4))*24;x.save();x.globalAlpha=a*ramp(t,wt(88),.35);x.strokeStyle=AMBER;x.lineWidth=9;x.lineCap='round';x.lineJoin='round';
  x.beginPath();x.moveTo(W/2,ay);x.lineTo(W/2,ay+70);x.moveTo(W/2-30,ay+42);x.lineTo(W/2,ay+72);x.lineTo(W/2+30,ay+42);x.stroke();x.restore();
  // you are not the only one: many lights around one
  const nk=ramp(t,wt(92),.9);const C=[W/2,1240];
  x.save();x.globalAlpha=a;x.fillStyle=AMBER;x.shadowColor=AMBER;x.shadowBlur=20;x.beginPath();x.arc(...C,14,0,6.28);x.fill();
  for(let i=0;i<46;i++){const an=i*2.39996,r=60+Math.sqrt(i)*48,on=cl(nk*1.4-i/46);if(on<=0)continue;
    const px=C[0]+Math.cos(an)*r*1.5,py=C[1]+Math.sin(an)*r*.55;x.globalAlpha=a*on;x.fillStyle=WHITE;x.shadowColor=WHITE;
    x.beginPath();x.arc(px,py,6+i%3*2,0,6.28);x.fill();
    if(i<14){x.strokeStyle=`rgba(242,242,242,${.18*on})`;x.lineWidth=2;x.beginPath();x.moveTo(...C);x.lineTo(px,py);x.stroke()}}
  x.restore();
  txt('مو الوحيد',W/2,1430,64,AMBER,{a:a*ramp(t,wt(93),.4),glow:16});
}

// ---------- main ----------
const END_CARD=1.0; // seconds after the last line ends
function draw(t){
  const L=T.lines;const last=L[8].e;
  // warmth & darkness by section
  const warm=ramp(t,L[6].s-.2,1.2)*(1-ramp(t,L[7].s,.4)*.6)+ (t>L[8].s?ramp(t,L[8].s,.6)*.6:0);
  const dark=ramp(t,L[5].s,1)*(1-ramp(t,L[6].s,.6))+ramp(t,L[7].s,.3)*(1-ramp(t,L[8].s,.4));
  // camera: push-ins on the hook and inner voice, pull-out on the CTA
  let z=1;
  if(t<L[1].s)z=lerp(1,1.06,eio((t-L[0].s)/(L[1].s-L[0].s)));
  else if(t<L[2].s)z=t>wt(15)?lerp(1.0,1.05,eo((t-wt(15))/1)):1;
  else if(t>=L[5].s&&t<L[6].s)z=lerp(1,1.12,(t-L[5].s)/(L[6].s-L[5].s));
  else if(t>=L[6].s&&t<L[7].s)z=lerp(1,1.03,ramp(t,wt(76),1));
  else if(t>=L[8].s)z=lerp(1.06,1,eo((t-L[8].s)/2.5));
  // tiny shake on the title hit
  const sh=t>wt(21)&&t<wt(21)+.35?(1-(t-wt(21))/.35)*3:0;
  x.save();x.fillStyle='#000';x.fillRect(0,0,W,H);
  x.translate(W/2+Math.sin(t*90)*sh,H/2+Math.cos(t*77)*sh);x.scale(z,z);x.translate(-W/2,-H/2);
  background(t,cl(warm),cl(dark));

  // S0/S1 hook
  const hk=ramp(t,0,.15)*(1-ramp(t,L[1].e+.1,.3));
  if(hk>0){const l1='نجحت…', l2='بس ما بتصدّق إنّك تستحق؟';
    txt(l1,W/2,400,104,WHITE,{a:hk*ramp(t,0,.25),glow:8});
    txt(l2,W/2,540,76,AMBER,{a:hk*ramp(t,.3,.35),blur:lerp(8,0,ramp(t,.3,.4))});
  }
  lineChart(t);
  // S2 title + mask
  {const a=ramp(t,L[2].s-.1,.3)*(1-ramp(t,L[3].s-.2,.3));
   if(a>0){mask(W/2,1250,1.05,a*ramp(t,wt(18),.5),eo(ramp(t,wt(22),.8))*.9);
     if(t<wt(21))txt('هاد الشعور إلُه اسم…',W/2,700,72,MUTED,{w:400,a:a*ramp(t,wt(17),.4)});
     else{x.save();x.globalAlpha=a;titleCard(t,wt(21)-.05,520);x.restore()}}}
  bars(t);
  gapChart(t);
  innerVoice(t);
  doubtCard(t);
  // S7 the question: words centred, big
  {const a=ramp(t,L[7].s-.05,.3)*(1-ramp(t,L[8].s-.15,.25));
   if(a>0){x.save();x.globalAlpha=a;
     // two-line big question
     const lines=[[78,79,80],[81,82,83,84,85,86]];
     lines.forEach((ids,li)=>{const sz=li?72:120;const Y=li?1000:840;const ws=ids.map(i=>T.words[i].w);const sp=sz*.3;
       const widths=ws.map(w=>tw(w,sz));const total=widths.reduce((p,q)=>p+q,0)+sp*(ws.length-1);let X=W/2+total/2;
       ids.forEach((i,k)=>{const w=T.words[i];const on=t>=w.t-.03;txt(w.w,X-widths[k]/2,Y,sz,on?(li?WHITE:AMBER):'rgba(242,242,242,.2)',{a:1,glow:on?10:0});X-=widths[k]+sp})});
     x.restore()}}
  cta(t);
  // end card: the name at the end
  {const a=ramp(t,last+.45,.4);
   if(a>0){x.save();x.globalAlpha=a;x.fillStyle='rgba(5,7,11,.85)';x.fillRect(0,0,W,H);mask(W/2,1330,.95,a,.55);titleCard(t,last+.45,560);x.restore()}}
  x.restore();
  if(t<L[7].s-.1||t>L[7].e+.3)caption(t);
  post(t,.55+.25*cl(dark));
}
function drawCover(){ // cover still: brain-free (talking theme): mask + name, bold
  const t=99;x.save();background(1,0,0);x.restore();
  mask(W/2,1250,1.15,1,.6);
  txt('نجحت… بس حاسس إنّك ما بتستحق؟',W/2,330,58,WHITE,{glow:8});
  x.save();
  txt('IMPOSTER',W/2,560,230,WHITE,{fam:'Bebas',w:400,ls:10,glow:20});
  txt('SYNDROME',W/2,760,230,AMBER,{fam:'Bebas',w:400,ls:10,glow:24});
  txt('متلازمة المحتال',W/2,935,96,WHITE);
  x.restore();post(0,.6);
}
window.setup=async(timing)=>{T=timing;await document.fonts.load('700 40px Plex');await document.fonts.load('400 40px Plex');await document.fonts.load('40px Bebas');
  document.fonts.check('40px Bebas');return true};
window.frame=(t)=>{draw(t);return c.toDataURL('image/jpeg',.93)};
window.cover=()=>{drawCover();return c.toDataURL('image/jpeg',.95)};
</script></body></html>
