<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>reel</title>
<style>
/* One 9:16 neurotransmitter reel (540x960 CSS px, rendered at 2x). render.mjs calls reel.seek(t) per frame. */
@font-face { font-family: Tajawal; font-weight: 800; src: url(fonts/tajawal-800.ttf); }
@font-face { font-family: Tajawal; font-weight: 500; src: url(fonts/tajawal-500.ttf); }
html, body { margin: 0; width: 540px; height: 960px; overflow: hidden; background: #050B18; }
body { position: relative; font-family: Tajawal, sans-serif; color: #fff; direction: rtl; }
.bg { position: absolute; inset: 0; background: radial-gradient(80% 45% at 50% 42%, #0B2348 0%, #071430 45%, #040A18 100%); }
.grid { position: absolute; inset: 0; background: linear-gradient(rgba(80,170,255,.07) 1px, transparent 1px) 0 0 / 100% 30px, linear-gradient(90deg, rgba(80,170,255,.07) 1px, transparent 1px) 0 0 / 30px 100%; -webkit-mask-image: radial-gradient(75% 60% at 50% 45%, #000, transparent); }
canvas { position: absolute; inset: 0; width: 540px; height: 960px; }
.tag { position: absolute; top: 52px; right: 26px; font-weight: 500; font-size: 15px; color: #9FD4FF; letter-spacing: .02em; }
.cover { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; padding-bottom: 170px; text-align: center; background: linear-gradient(transparent 45%, rgba(4,10,24,.85) 75%); }
.cover h1 { margin: 0; font-weight: 800; font-size: 78px; line-height: 1.05; color: #fff; text-shadow: 0 0 24px rgba(255,59,74,.85), 0 0 60px rgba(255,59,74,.45), 0 3px 4px rgba(0,0,0,.6); }
.cover p { margin: 10px 0 0; font: 800 20px Tajawal, sans-serif; color: #FF8A94; letter-spacing: .3em; direction: ltr; }
.cover span { margin-top: 18px; font-weight: 500; font-size: 18px; color: #BFE3FF; }
.lab { position: absolute; left: 0; top: 0; white-space: nowrap; font-weight: 800; font-size: 19px; color: #fff; text-shadow: 0 0 10px rgba(80,170,255,.9), 0 0 2px #000; opacity: 0; }
.lab.hot { color: #FF6B78; text-shadow: 0 0 12px rgba(255,59,74,.9), 0 0 2px #000; }
.lab small { display: block; font: 500 12px Tajawal, sans-serif; color: #BFE3FF; direction: ltr; letter-spacing: .08em; }
.lab.hot small { color: #FFC2C7; }
svg.lines { position: absolute; inset: 0; width: 540px; height: 960px; }
.cap { position: absolute; top: 676px; inset-inline: 22px; text-align: center; font-weight: 800; font-size: 34px; line-height: 1.4; color: #fff; text-shadow: 0 0 14px rgba(70,160,255,.95), 0 0 30px rgba(70,160,255,.5), 0 2px 3px rgba(0,0,0,.6); }
.cap i { font-style: normal; opacity: .38; }
.cap i.on { opacity: 1; }
.cap i.now { opacity: 1; color: #FFE2E5; text-shadow: 0 0 14px rgba(255,59,74,.95), 0 0 30px rgba(255,59,74,.45); }
.fact { position: absolute; top: 160px; right: 26px; font-weight: 800; font-size: 22px; color: #fff; opacity: 0; text-shadow: 0 0 12px rgba(80,170,255,.8); }
.fact b { color: #FF6B78; text-shadow: 0 0 12px rgba(255,59,74,.8); }
</style>
</head>
<body>
<div class="bg"></div><div class="grid"></div>
<canvas id="c"></canvas>
<svg class="lines" id="lines"></svg>
<div id="labs"></div>
<div class="tag">علم الشعور · النواقل العصبية</div>
<div class="fact" id="fact"></div>
<div class="cap" id="cap"></div>
<div class="cover" id="cover"><h1 id="cv-name"></h1><p id="cv-latin"></p><span>علم الشعور · النواقل العصبية</span></div>
<script type="module">
import * as THREE from './three.module.js';
const slug = location.search.slice(1);
const R = await (await fetch(`${slug}.json`)).json();
const $ = id => document.getElementById(id);
$('cv-name').textContent = R.name; $('cv-latin').textContent = R.latin;
const LEAD = R.lead ?? 1.4; // seconds of cover before the narration starts

// deterministic randomness
let seed = 11; const rnd = (a = 0, b = 1) => a + (b - a) * (((seed = (seed * 16807) % 2147483647) - 1) / 2147483646);
const BLUE = new THREE.Color('#4FB4FF'), RED = new THREE.Color('#FF3B4A'), WHITE = new THREE.Color('#EAF6FF');

const ren = new THREE.WebGLRenderer({ canvas: $('c'), antialias: true, alpha: true, preserveDrawingBuffer: true });
ren.setPixelRatio(2); ren.setSize(540, 960, false); ren.setClearColor(0, 0);
const scene = new THREE.Scene(), cam = new THREE.PerspectiveCamera(34, 540 / 960, .05, 60);

// fresnel hologram material: bright rim, faint body, moving scan lines
function holo(color, alpha = 1) {
  return new THREE.ShaderMaterial({
    uniforms: { uC: { value: new THREE.Color(color) }, uA: { value: alpha }, uT: { value: 0 }, uHot: { value: 0 } },
    vertexShader: `varying vec3 vN; varying vec3 vV; varying vec3 vW;
      void main(){ vec4 w = modelMatrix * vec4(position,1.); vW = w.xyz; vN = normalize(mat3(modelMatrix) * normal); vV = normalize(cameraPosition - w.xyz); gl_Position = projectionMatrix * viewMatrix * w; }`,
    fragmentShader: `uniform vec3 uC; uniform float uA, uT, uHot; varying vec3 vN; varying vec3 vV; varying vec3 vW;
      void main(){ float f = pow(1. - abs(dot(normalize(vN), normalize(vV))), 2.2);
        float scan = .75 + .25 * sin(vW.y * 90. - uT * 6.);
        vec3 c = mix(uC, vec3(1.0, .23, .29), uHot);
        float a = (f * .95 + .07 + uHot * .18) * scan * uA;
        gl_FragColor = vec4(c * (1.1 + f), a); }`,
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide,
  });
}
// soft round dot for every particle
const dot = (() => { const c = document.createElement('canvas'); c.width = c.height = 64; const x = c.getContext('2d'), g = x.createRadialGradient(32, 32, 0, 32, 32, 32);
  g.addColorStop(0, 'rgba(255,255,255,1)'); g.addColorStop(.45, 'rgba(255,255,255,.85)'); g.addColorStop(1, 'rgba(255,255,255,0)'); x.fillStyle = g; x.fillRect(0, 0, 64, 64); return new THREE.CanvasTexture(c); })();
const pts = (geo, color, size, op = .8) => new THREE.Points(geo, new THREE.PointsMaterial({ color, size: size * 1.6, map: dot, transparent: true, opacity: op, depthWrite: false, blending: THREE.AdditiveBlending, sizeAttenuation: true }));
const mats = [];
const track = m => { m.traverse(o => o.material?.uniforms && mats.push(o.material)); return m; };

/* ---------- brain ---------- */
const brain = new THREE.Group(); scene.add(brain);
// smooth 3D value noise, used for the gyri and sulci
const hash = (x, y, z) => { const h = Math.sin(x * 127.1 + y * 311.7 + z * 74.7) * 43758.5453; return h - Math.floor(h); };
function vnoise(x, y, z) {
  const X = Math.floor(x), Y = Math.floor(y), Z = Math.floor(z), u = x - X, v = y - Y, w = z - Z;
  const f = q => q * q * (3 - 2 * q), a = f(u), b = f(v), c = f(w), L = (p, q, k) => p + (q - p) * k;
  return L(L(L(hash(X, Y, Z), hash(X + 1, Y, Z), a), L(hash(X, Y + 1, Z), hash(X + 1, Y + 1, Z), a), b),
           L(L(hash(X, Y, Z + 1), hash(X + 1, Y, Z + 1), a), L(hash(X, Y + 1, Z + 1), hash(X + 1, Y + 1, Z + 1), a), b), c);
}
// narrow grooves where the noise crosses its middle: wide rounded gyri, thin sulci
const sulci = (x, y, z) => { let g = 0, amp = 1, fr = 5.2; for (let o = 0; o < 2; o++) { const n = vnoise(x * fr + o * 7, y * fr, z * fr); g += amp * Math.pow(1 - Math.abs(n * 2 - 1), 6); amp *= .45; fr *= 2.1; } return g; };
// a hemisphere is the union of four lobes (local x points away from the midline)
const LOBES = [[0, .1, -.02, .8, .55, 1.0], [0, .04, .42, .74, .5, .62], [0, .0, -.58, .64, .46, .5], [.1, -.28, .16, .66, .27, .56]];
function rayR(d) { let best = 0;
  for (const [cx, cy, cz, rx, ry, rz] of LOBES) { const ax = d.x / rx, ay = d.y / ry, az = d.z / rz, bx = cx / rx, by = cy / ry, bz = cz / rz;
    const A = ax * ax + ay * ay + az * az, B = -2 * (ax * bx + ay * by + az * bz), C = bx * bx + by * by + bz * bz - 1, D = B * B - 4 * A * C;
    if (D >= 0) best = Math.max(best, (-B + Math.sqrt(D)) / (2 * A)); }
  return best; }
function hemisphere(side) {
  const g = new THREE.IcosahedronGeometry(1, 72), p = g.attributes.position, d = new THREE.Vector3();
  for (let i = 0; i < p.count; i++) {
    d.fromBufferAttribute(p, i).normalize();
    let r = rayR(d), x = d.x * r, y = d.y * r, z = d.z * r;
    // lateral (Sylvian) fissure between the temporal lobe and the lobes above, and the central sulcus
    const ys = -.1 + .2 * (.45 - z), lat = Math.max(0, Math.min(1, (x - .15) * 4)) * (z > -.45 && z < .55 ? 1 : 0);
    let dent = .07 * lat * Math.exp(-(((y - ys) / .045) ** 2));
    const zc = .04 - .3 * (y - .55); dent += .045 * (y > -.02 ? 1 : 0) * Math.exp(-(((z - zc) / .03) ** 2));
    dent += .028 * sulci(x, y, z);
    const k = 1 - dent / Math.max(r, .3); x *= k; y *= k; z *= k;
    if (x < 0) x *= .12;                    // flat medial wall along the longitudinal fissure
    if (y < -.42) y = -.42 + (y + .42) * .45; // flatter base
    p.setXYZ(i, side * (x + .1), y, z);
  }
  g.computeVertexNormals();
  const m = new THREE.Mesh(g, holo(BLUE, .9));
  const sub = new THREE.BufferGeometry(), arr = [];
  for (let i = 0; i < p.count; i += 5) arr.push(p.getX(i), p.getY(i), p.getZ(i));
  sub.setAttribute('position', new THREE.Float32BufferAttribute(arr, 3));
  m.add(pts(sub, '#7CC8FF', .006, .22));
  return m;
}
const hemis = [hemisphere(1), hemisphere(-1)]; hemis.forEach(h => brain.add(h));
// cerebellum with fine horizontal folia and a central vermis
const cereb = (() => { const g = new THREE.SphereGeometry(1, 96, 64), p = g.attributes.position, v = new THREE.Vector3();
  for (let i = 0; i < p.count; i++) { v.fromBufferAttribute(p, i); const ph = Math.atan2(v.y, -v.z);
    const k = (1 + .018 * Math.sin(ph * 64)) * (1 - .1 * Math.exp(-((v.x / .07) ** 2)) * (v.z < 0 ? 1 : .3)); v.multiplyScalar(k); p.setXYZ(i, v.x, v.y, v.z); }
  g.computeVertexNormals(); const m = new THREE.Mesh(g, holo('#3FA2F0', .8)); m.scale.set(.66, .3, .36); m.position.set(0, -.46, -.8); return m; })();
brain.add(cereb);
// brainstem (midbrain, pons, medulla) and the spinal cord below it
const stemProfile = [[.15, .12], [.15, 0], [.2, -.16], [.21, -.28], [.15, -.42], [.12, -.6], [.1, -.72]].map(([r, y]) => new THREE.Vector2(r, y));
const makeStem = (mat, k = 1) => { const g = new THREE.Group();
  const a = new THREE.Mesh(new THREE.LatheGeometry(stemProfile.map(v => new THREE.Vector2(v.x * k, v.y)), 32), mat()); a.scale.z = .85; g.add(a);
  const c = new THREE.Mesh(new THREE.CylinderGeometry(.095 * k, .085 * k, .8, 20, 1, true), mat()); c.position.set(0, -1.1, -.06); c.rotation.x = .16; g.add(c);
  g.position.set(0, -.26, -.3); g.rotation.x = .32; return g; };
const stem = makeStem(() => holo('#3FA2F0', .8)); brain.add(stem);
// regions, shown red when explained
const regions = {};
const blob = (sx, sy, sz) => { const m = new THREE.Mesh(new THREE.SphereGeometry(1, 32, 24), holo(RED, 0)); m.scale.set(sx, sy, sz); return m; };
function pair(make, pos) { const g = new THREE.Group(); [1, -1].forEach(s => { const m = make(s); m.position.set(pos[0] * s, pos[1], pos[2]); g.add(m); }); return g; }
regions.amygdala = pair(() => blob(.09, .08, .1), [.4, -.32, .28]);
regions.thalamus = pair(() => blob(.12, .1, .17), [.13, -.02, -.08]);
regions.hippocampus = pair(s => { const c = new THREE.CatmullRomCurve3([new THREE.Vector3(0, 0, .12), new THREE.Vector3(-.03 * s, .05, -.15), new THREE.Vector3(-.1 * s, .25, -.4)]); return new THREE.Mesh(new THREE.TubeGeometry(c, 40, .055, 12), holo(RED, 0)); }, [.4, -.33, .14]);
regions.forebrain = (() => { const m = blob(.17, .07, .1); m.position.set(0, -.28, .38); return m; })();
regions.motor = pair(s => { const c = new THREE.EllipseCurve(0, 0, .55, .62, 0, Math.PI / 2); const p3 = c.getPoints(30).map(p => new THREE.Vector3(p.x * s * .95, p.y * 1.0 - .08, 0)); return new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(p3), 60, .045, 10), holo(RED, 0)); }, [0, 0, .02]);
regions.hypothalamus = (() => { const m = blob(.1, .07, .09); m.position.set(0, -.25, .1); return m; })();
regions.pituitary = (() => { const g = new THREE.Group(), b = blob(.06, .05, .06); b.position.set(0, -.45, .2); g.add(b);
  const st = new THREE.Mesh(new THREE.CylinderGeometry(.015, .015, .16, 8, 1, true), holo(RED, 0)); st.position.set(0, -.36, .16); g.add(st); return g; })();
regions.cord = makeStem(() => holo(RED, 0), 1.06);
regions.cortex = new THREE.Group(); // handled by tinting the hemispheres
// a soft red glow at the centre of every region, lit with it
const glows = {};
for (const [k, r] of Object.entries(regions)) {
  const box = new THREE.Box3().setFromObject(r); if (box.isEmpty()) continue;
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: dot, color: RED, transparent: true, opacity: 0, depthWrite: false, blending: THREE.AdditiveBlending }));
  const size = box.getSize(new THREE.Vector3()); sp.position.copy(box.getCenter(new THREE.Vector3())); sp.scale.setScalar(Math.min(.9, Math.max(.35, Math.max(size.x, size.y) * 1.6)));
  brain.add(sp); glows[k] = sp; r.userData.center = sp.position.clone();
}
Object.values(regions).forEach(r => { brain.add(r); track(r); });
track(brain);
// projections from the basal forebrain to the cortex
const projG = new THREE.BufferGeometry(), projP = [];
const pf = R.projFrom || [0, -.26, .38];
for (let i = 0; i < 40; i++) { const a = new THREE.Vector3(pf[0] + rnd(-.1, .1), pf[1], pf[2]), b = new THREE.Vector3(rnd(-1, 1), rnd(.1, .65), rnd(-.9, .9)); b.x = Math.sign(b.x) * (.5 + .45 * Math.abs(b.x)); projP.push(a.x, a.y, a.z, b.x, b.y, b.z); }
projG.setAttribute('position', new THREE.Float32BufferAttribute(projP, 3));
const proj = new THREE.LineSegments(projG, new THREE.LineBasicMaterial({ color: RED, transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false }));
brain.add(proj);

/* ---------- synapse ---------- */
const syn = new THREE.Group(); scene.add(syn);
const pre = new THREE.Mesh(new THREE.SphereGeometry(1, 64, 48), holo(BLUE)); pre.scale.set(.95, .8, .95); pre.position.y = .95; syn.add(pre);
const axon = new THREE.Mesh(new THREE.CylinderGeometry(.22, .3, 1.6, 32, 1, true), holo(BLUE)); axon.position.y = 2.3; syn.add(axon);
const post = new THREE.Mesh(new THREE.SphereGeometry(4, 96, 48, 0, Math.PI * 2, 0, .42), holo(BLUE)); post.position.y = -4.25; syn.add(post);
const vesicles = new THREE.Group(); syn.add(vesicles);
for (let i = 0; i < 26; i++) { const v = new THREE.Mesh(new THREE.SphereGeometry(rnd(.07, .1), 20, 14), holo('#7FD0FF')); v.position.set(rnd(-.55, .55), rnd(.35, 1.1), rnd(-.5, .5)); v.userData.y0 = v.position.y; vesicles.add(v); }
const receptors = [];
for (let i = 0; i < 9; i++) { const x = -1.2 + i * .3, r = new THREE.Mesh(new THREE.CylinderGeometry(.06, .06, .16, 16, 1, true), holo('#7FD0FF')); r.position.set(x, -.25 - .012 * x * x, rnd(-.15, .15)); syn.add(r); receptors.push(r); }
// neurotransmitter molecules (red) and ions (white) crossing the cleft
const NT = 260, ntPos = new Float32Array(NT * 3), ntSeed = Array.from({ length: NT }, () => ({ x: rnd(-.45, .45), z: rnd(-.35, .35), d: rnd(0, 1), r: Math.floor(rnd(0, 9)), j: rnd(0, 6.28) }));
const ntGeo = new THREE.BufferGeometry(); ntGeo.setAttribute('position', new THREE.BufferAttribute(ntPos, 3));
const nt = pts(ntGeo, '#FF3B4A', .075, 1); nt.frustumCulled = false; syn.add(nt);
const ION = 140, ionPos = new Float32Array(ION * 3), ionSeed = Array.from({ length: ION }, () => ({ r: Math.floor(rnd(0, 9)), d: rnd(0, 1), j: rnd(0, 6.28) }));
const ionGeo = new THREE.BufferGeometry(); ionGeo.setAttribute('position', new THREE.BufferAttribute(ionPos, 3));
const ions = pts(ionGeo, '#FFFFFF', .05, .9); ions.frustumCulled = false; syn.add(ions);
track(syn);

/* ---------- muscle (acetylcholine) ---------- */
const mus = new THREE.Group(); scene.add(mus);
const fiberMat = new THREE.ShaderMaterial({
  uniforms: { uS: { value: 1 }, uT: { value: 0 } },
  vertexShader: `varying vec3 vN; varying vec3 vV; varying vec3 vP; void main(){ vP = position; vec4 w = modelMatrix * vec4(position,1.); vN = normalize(mat3(modelMatrix)*normal); vV = normalize(cameraPosition - w.xyz); gl_Position = projectionMatrix * viewMatrix * w; }`,
  fragmentShader: `uniform float uS, uT; varying vec3 vN; varying vec3 vV; varying vec3 vP;
    void main(){ float f = pow(1. - abs(dot(normalize(vN), normalize(vV))), 2.); float band = smoothstep(.55, 1., sin(vP.y * 22. / uS) * .5 + .5);
      vec3 c = mix(vec3(.31,.7,1.), vec3(1.,.25,.3), (1. - uS) * 4.); gl_FragColor = vec4(c * 1.3, (f * .9 + band * .28 + .05)); }`,
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide });
const fiber = new THREE.Mesh(new THREE.CylinderGeometry(.55, .55, 4.2, 64, 1, true), fiberMat); fiber.rotation.z = Math.PI / 2; fiber.position.y = -.9; mus.add(fiber);
const nerve = new THREE.Mesh(new THREE.CylinderGeometry(.1, .14, 2.2, 24, 1, true), holo(BLUE)); nerve.position.set(0, 1.25, 0); mus.add(nerve);
const term = new THREE.Mesh(new THREE.SphereGeometry(.38, 40, 30), holo(BLUE)); term.scale.y = .7; term.position.set(0, .05, 0); mus.add(term);
const MA = 120, maPos = new Float32Array(MA * 3), maSeed = Array.from({ length: MA }, () => ({ x: rnd(-.3, .3), z: rnd(-.3, .3), d: rnd(0, 1) }));
const maGeo = new THREE.BufferGeometry(); maGeo.setAttribute('position', new THREE.BufferAttribute(maPos, 3));
const ach = pts(maGeo, '#FF3B4A', .06, 1); ach.frustumCulled = false; mus.add(ach);
track(mus);

/* ---------- labels ---------- */
const labs = {}, lineEls = {};
function label(id, ar, la, anchor, dx, dy) {
  const el = document.createElement('div'); el.className = 'lab'; el.innerHTML = `${ar}${la ? `<small>${la}</small>` : ''}`; $('labs').append(el);
  const ln = document.createElementNS('http://www.w3.org/2000/svg', 'line'); ln.setAttribute('stroke', '#9FD4FF'); ln.setAttribute('stroke-width', '1'); $('lines').append(ln);
  labs[id] = { el, ln, anchor, dx, dy };
}
const v3 = new THREE.Vector3();
function placeLabels(on, hot) {
  for (const [id, L] of Object.entries(labs)) {
    const a = on[id] || 0; L.el.style.opacity = a; L.ln.style.opacity = a * .7;
    L.el.classList.toggle('hot', !!hot[id]); L.ln.setAttribute('stroke', hot[id] ? '#FF6B78' : '#9FD4FF');
    if (!a) continue;
    L.anchor.getWorldPosition(v3); v3.project(cam);
    const x = (v3.x * .5 + .5) * 540, y = (-v3.y * .5 + .5) * 960, lx = x + L.dx, ly = y + L.dy;
    const w = L.el.offsetWidth, h = L.el.offsetHeight, left = Math.max(14, Math.min(526 - w, lx - w / 2));
    L.el.style.transform = `translate(${left}px, ${ly - h / 2}px)`;
    L.ln.setAttribute('x1', x); L.ln.setAttribute('y1', y); L.ln.setAttribute('x2', lx); L.ln.setAttribute('y2', ly + (L.dy > 0 ? -h / 2 : h / 2));
  }
}
const anchorAt = (parent, x, y, z) => { const o = new THREE.Object3D(); o.position.set(x, y, z); parent.add(o); return o; };
label('amygdala', 'اللوزة الدماغية', 'AMYGDALA', anchorAt(brain, .4, -.32, .28), 70, 95);
label('thalamus', 'المهاد', 'THALAMUS', anchorAt(brain, -.13, -.02, -.08), -80, -110);
label('hippocampus', 'الحُصين', 'HIPPOCAMPUS', anchorAt(brain, -.42, -.25, -.1), -60, 105);
label('forebrain', 'قاعدة الدماغ الأمامي', 'BASAL FOREBRAIN', anchorAt(brain, 0, -.28, .38), 0, 110);
label('hypothalamus', 'تحت المهاد', 'HYPOTHALAMUS', anchorAt(brain, 0, -.25, .1), 80, 120);
label('pituitary', 'الغدة النخامية', 'PITUITARY', anchorAt(brain, 0, -.45, .2), -60, 110);
label('cord', 'جذع الدماغ والحبل الشوكي', 'BRAINSTEM · SPINAL CORD', anchorAt(brain, 0, -1.2, -.6), 150, -20);
label('cortex', 'القشرة الدماغية', 'CORTEX', anchorAt(brain, .75, .45, .1), 30, -70);
label('motor', 'القشرة الحركية', 'MOTOR CORTEX', anchorAt(brain, -.45, .55, .02), -30, -70);
label('pre', 'الخلية المُرسِلة', 'PRESYNAPTIC', anchorAt(syn, .9, 1.2, 0), 40, -60);
label('post', 'الخلية المستقبِلة', 'POSTSYNAPTIC', anchorAt(syn, -.9, -.32, 0), -40, 70);
label('receptor', 'المستقبِلات', 'RECEPTORS', anchorAt(syn, .9, -.25, 0), 50, 60);
label('ions', R.ion || '', R.ionLatin || '', anchorAt(syn, -.3, -.45, 0), -70, 110);
label('nerve', 'العصب الحركي', 'MOTOR NEURON', anchorAt(mus, 0, .7, 0), 110, 70);
label('muscle', 'الليف العضلي', 'MUSCLE FIBER', anchorAt(mus, 1.4, -.35, 0), -20, -90);
label('enzyme', 'إنزيم التفكيك', 'ACETYLCHOLINESTERASE', anchorAt(mus, -.4, -.35, 0), -40, 120);

/* ---------- captions ---------- */
const chunks = [];
R.lines.forEach(l => { const n = Math.ceil(l.words.length / 5), k = Math.ceil(l.words.length / n);
  for (let i = 0; i < l.words.length; i += k) { const w = l.words.slice(i, i + k), next = l.words[i + k];
    chunks.push({ a: w[0].t, b: next ? next.t : l.b + .2, words: w }); } });

/* ---------- timeline ---------- */
const ease = x => { x = Math.max(0, Math.min(1, x)); return x * x * (3 - 2 * x); };
const T = b => (b.at !== undefined ? R.lines[b.at].a : b.t) + (b.dt || 0) - .2;
const beats = R.beats.map(b => ({ ...b, t0: T(b) }));
const stateAt = t => { const s = { scene: 'brain', hot: [], labels: [], cortex: 0, proj: 0, fact: '' }; let since = 99, sceneSince = 99;
  for (const b of beats) if (b.t0 <= t) { if (b.scene && b.scene !== s.scene) sceneSince = t - b.t0; Object.assign(s, b); since = t - b.t0; }
  return { ...s, since, sceneSince }; };
let lastScene = 'brain', fade = { brain: 1, syn: 0, mus: 0 };

// close in on small parts, less on wide ones (cord, several parts at once)
const k2dist = parts => parts.includes('cord') ? 6.9 : parts.length > 1 ? 6.0 : 5.3;
const view = new THREE.Vector3(0, .2, 1).normalize(), camT = new THREE.Vector3(0, -.1, 0), wp = new THREE.Vector3();
let camD = 15;
cam.setViewOffset(540, 960, 0, 110, 540, 960); // keep the subject above the captions
window.reel = { duration: R.duration + .6 + LEAD, lead: LEAD, seek(tr) {
  const t = tr - LEAD;
  const s = stateAt(t);
  if (t < 0) Object.assign(s, { hot: R.coverHot || [], labels: [], hotLabels: [], fact: '' });
  // scene crossfade
  const k = ease(s.sceneSince / .7);
  for (const n of ['brain', 'syn', 'mus']) fade[n] = n === s.scene ? k : Math.min(fade[n], 1 - k);
  brain.visible = fade.brain > .01; syn.visible = fade.syn > .01; mus.visible = fade.mus > .01;
  // brain: slow turn, gentle push-in, regions in red
  brain.rotation.y = 1.05 + .075 * tr; brain.rotation.x = .08; // slow turn so the volume reads
  const hotSet = new Set(s.hot);
  for (const [k2, r] of Object.entries(regions)) r.traverse(o => { if (o.material?.uniforms) { const u = o.material.uniforms; const target = hotSet.has(k2) ? 1 : 0; u.uA.value += (target * (.75 + .25 * Math.sin(t * 5)) - u.uA.value) * .25; u.uHot.value = 1; } });
  hemis.forEach(h => { h.material.uniforms.uHot.value += ((hotSet.has('cortex') || hotSet.has('motor') && false ? .8 : 0) - h.material.uniforms.uHot.value) * .15; });
  for (const [k2, sp] of Object.entries(glows)) sp.material.opacity += ((hotSet.has(k2) ? .55 + .15 * Math.sin(tr * 4) : 0) * fade.brain - sp.material.opacity) * .2;
  proj.material.opacity += ((s.proj ? .55 : 0) - proj.material.opacity) * .15;
  // synapse: release, cross, bind; ions flow when bound
  const rel = s.release ? ease((t - s.releaseT0) / 1) : 0;
  const ph = t * .45;
  for (let i = 0; i < NT; i++) { const q = ntSeed[i], r = receptors[q.r].position, p = (ph + q.d) % 1, on = rel * (p < .85 ? 1 : 0);
    const y = .25 - p * .55, x = q.x + (r.x - q.x) * ease(p * 1.25) + .03 * Math.sin(t * 3 + q.j), z = q.z + (r.z - q.z) * ease(p * 1.25);
    ntPos.set(on ? [x, y, z] : [0, -50, 0], i * 3); }
  ntGeo.attributes.position.needsUpdate = true;
  const ionOn = s.ionflow ? ease((t - s.ionT0) / 1) : 0;
  for (let i = 0; i < ION; i++) { const q = ionSeed[i], r = receptors[q.r].position, p = (t * .5 + q.d) % 1, dir = s.ionflow === 'out' ? -1 : 1;
    ionPos.set(ionOn ? [r.x + .05 * Math.sin(q.j + t * 4), r.y + .35 - dir * 0 - p * .9, r.z + .05 * Math.cos(q.j + t * 4)] : [0, -50, 0], i * 3); }
  ionGeo.attributes.position.needsUpdate = true;
  receptors.forEach(r => { r.material.uniforms.uHot.value += ((rel > .5 ? 1 : 0) - r.material.uniforms.uHot.value) * .2; });
  vesicles.children.forEach((v, i) => { v.position.y = v.userData.y0 + .03 * Math.sin(t * 2 + i); });
  syn.rotation.y = Math.sin(t * .25) * .35; syn.rotation.x = .12;
  // muscle: ACh crosses, fiber contracts, enzyme clears, fiber relaxes
  const mT = s.scene === 'mus' ? s.sceneSince : 0, cyc = (mT % 4.5) / 4.5;
  const cross = cyc < .45 ? cyc / .45 : 1, clear = cyc > .6 ? Math.min(1, (cyc - .6) / .25) : 0;
  for (let i = 0; i < MA; i++) { const q = maSeed[i], p = (cross + q.d * .25) % 1; maPos.set(cyc < .85 && (1 - clear) > q.d ? [q.x, -.15 - Math.min(1, cross + q.d * .2) * .2, q.z] : [0, -50, 0], i * 3); }
  maGeo.attributes.position.needsUpdate = true;
  const contr = cyc > .35 && cyc < .7 ? ease((cyc - .35) / .1) * (1 - ease((cyc - .6) / .1)) : 0;
  fiber.scale.y = 1 - .12 * contr; fiberMat.uniforms.uS.value = 1 - .12 * contr;
  mus.rotation.y = -.35 + Math.sin(t * .2) * .15;
  // fades
  const setA = (g, a) => g.traverse(o => { if (o.material) { if (o.material.uniforms?.uA && g !== brain) o.material.uniforms.uA.value = (o.userData.a0 ??= o.material.uniforms.uA.value) * a; else if (o.material.uniforms?.uA) {} else { o.material.opacity = (o.userData.o0 ??= o.material.opacity) * a; } } });
  setA(syn, fade.syn); setA(mus, fade.mus);
  hemis.concat([cereb]).forEach(m => m.material.uniforms.uA.value = .9 * fade.brain); stem.children.forEach(m => m.material.uniforms.uA.value = .8 * fade.brain);
  hemis.forEach(h => h.children[0].material.opacity = .22 * fade.brain);
  // camera
  // camera: wide on the cover, then into the brain toward the part in red
  let tgt = new THREE.Vector3(0, -.15, 0), dist = 8.4;
  if (s.scene === 'syn') { tgt.set(0, .35, 0); dist = 8.6; }
  else if (s.scene === 'mus') { tgt.set(0, -.4, 0); dist = 8.8; }
  else if (t >= 0) { const parts = s.hot.filter(k => regions[k]?.userData.center);
    if (parts.length) { tgt.set(0, 0, 0); parts.forEach(k => tgt.add(brain.localToWorld(wp.copy(regions[k].userData.center)))); tgt.divideScalar(parts.length); dist = k2dist(parts); }
    else if (s.hot.includes('cortex')) dist = 6.4; else dist = 6.9; }
  else dist = 6.2; // cover
  camT.lerp(tgt, tr < .02 ? 1 : .05); camD += (dist - camD) * (tr < .02 ? 0 : .045);
  cam.position.copy(camT).addScaledVector(view, camD); cam.lookAt(camT);
  mats.forEach(m => m.uniforms.uT && (m.uniforms.uT.value = tr));
  fiberMat.uniforms.uT.value = t;
  ren.render(scene, cam);
  $('cover').style.opacity = 1 - ease((tr - LEAD + .35) / .5);
  // labels
  const on = {}, hot = {}; const la = ease(s.since / .4);
  (s.labels || []).forEach(id => { on[id] = la * Math.max(fade[s.scene], 0); });
  (s.hot || []).forEach(id => hot[id] = 1); (s.hotLabels || []).forEach(id => hot[id] = 1);
  placeLabels(on, hot);
  // fact line
  $('fact').innerHTML = s.fact || ''; $('fact').style.opacity = s.fact ? ease(s.since / .4) : 0;
  // captions
  const c = chunks.find(c => t >= c.a - .05 && t < c.b);
  $('cap').innerHTML = c ? c.words.map(w => `<i class="${t >= w.t - .04 ? (w === c.words.findLast(x => t >= x.t - .04) ? 'now' : 'on') : ''}">${w.w}</i>`).join(' ') : '';
} };
// release/ion start times from beats
for (const b of beats) { if (b.release) b.releaseT0 = b.t0; if (b.ionflow) b.ionT0 = b.t0; }
for (let i = 1; i < beats.length; i++) { const p = beats[i - 1], b = beats[i];
  if (b.release && p.release && b.scene === undefined) b.releaseT0 = p.releaseT0; if (b.ionflow && p.ionflow) b.ionT0 = p.ionT0; }
window.reel.seek(0);
await document.fonts.ready;
document.body.dataset.ready = 1;
</script>
